name: "tupay"
version: 2
categories:
  - path: "stack/backend.md"
    description: "Go 1.27.1, Fiber v3, GORM dual-dialect, Redis optional, JWT sessions"
    group: "stack"
  - path: "stack/frontend.md"
    description: "React 19.3, Vite 8, TanStack Query, Tailwind CSS 4, axios in http.js only"
    group: "stack"
  - path: "stack/database.md"
    description: "SQLite default + PostgreSQL production, AutoMigrate, backend-agnostic Down"
    group: "stack"
  - path: "stack/dependencies.md"
    description: "Restricted imports (axios, recharts, react-pdf), govulncheck after go.mod"
    group: "stack"
  - path: "architecture/layers.md"
    description: "Controllers → queries → models, platform abstractions, utils.OK/Fail envelope"
    group: "architecture"
  - path: "architecture/organization.md"
    description: "File size caps (controllers ≤400, models ≤200), route order, one-line comments"
    group: "architecture"
  - path: "patterns/api.md"
    description: "Envelope responses, /api/v1 before /api, public→gateway→private order"
    group: "patterns"
  - path: "patterns/security.md"
    description: "JWT sessions (sid-bound), CSRF double-submit, API key gateway, idempotency"
    group: "patterns"
  - path: "patterns/data-handling.md"
    description: "decimal.Decimal for money (never float64), YYYY-MM-DD dates, UUID keys"
    group: "patterns"
  - path: "patterns/error-handling.md"
    description: "utils.Fail with stable English, 422 for business rules, no panic in prod"
    group: "patterns"
  - path: "patterns/testing.md"
    description: "In-memory SQLite default, flow_fixtures_test.go builders (check:fixtures CI)"
    group: "patterns"
  - path: "patterns/integration.md"
    description: "Gateway interface, ParseAndVerify webhooks, outbox worker with retry backoff"
    group: "patterns"
  - path: "patterns/ai-localization.md"
    description: "X-Locale header (en/id), languageDirective + currencyDirective (no $ defaults)"
    group: "patterns"
  - path: "style/naming.md"
    description: "snake_case files, PascalCase exports, lowercase gateway names, camelCase hooks"
    group: "style"
  - path: "style/imports.md"
    description: "stdlib→third-party→internal groups, @ alias for webui/src, restricted imports"
    group: "style"
  - path: "style/types.md"
    description: "Money = decimal.Decimal, uuid.UUID keys, *time.Time optional, GORM/JSON tags"
    group: "style"
  - path: "components/hooks.md"
    description: "TanStack Query hooks, query key functions, invalidateAll on mutations"
    group: "components"
  - path: "domain/concepts.md"
    description: "Invoice lifecycle (draft→sent→paid), effective status overlays, business rules"
    group: "domain"
  - path: "ops/build-deployment.md"
    description: "Makefile orchestration, VERSION sync, dev→main→master promotion, file size CI"
    group: "ops"
