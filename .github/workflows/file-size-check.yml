name: File Size Check

on:
  push:
    paths:
      - "scripts/check-file-size.mjs"
      - "scripts/file-size-baseline.json"
      - "app/**"
      - "pkg/**"
      - "platform/**"
      - "webui/src/**"
      - ".github/workflows/file-size-check.yml"
  pull_request:
    paths:
      - "scripts/check-file-size.mjs"
      - "scripts/file-size-baseline.json"
      - "app/**"
      - "pkg/**"
      - "platform/**"
      - "webui/src/**"
      - ".github/workflows/file-size-check.yml"

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun run --cwd=webui check:size
