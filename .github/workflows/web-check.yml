name: Web Check

on:
  push:
    paths:
      - "webui/**"
      - "Makefile"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "webui/**"
      - "Makefile"
      - ".github/workflows/web-check.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:charts
      - run: npm run build
      - run: npm run check:bundles:strict
