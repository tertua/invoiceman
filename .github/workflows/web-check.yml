name: Web Check

on:
  push:
    paths:
      - "webui/**"
      - "Makefile"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "webui/**"
      - "Makefile"
      - ".github/workflows/web-check.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run check:charts
      - run: bun run build
      - run: bun run check:bundles:strict
