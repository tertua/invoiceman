# Squash-merge Dependabot minor/patch PRs into dev once every reported
# check is green. Major bumps are left for manual review on purpose.
#
# Why pull_request_target: Dependabot-triggered `pull_request` runs get a
# read-only token, so the merge call would 403. pull_request_target runs
# with the base branch's write token and this workflow never checks out
# PR code — it only reads metadata and merges. Merge commits are disabled
# at the repo level, so --squash is the only path (keeps history linear
# for branch-flow / make check-flow).
name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  # gh pr checks --watch reads the check-run rollup; without read access it
  # fails with "Resource not accessible by integration". actions: read is
  # needed for the checkSuite -> workflowRun link in the same query.
  checks: read
  statuses: read
  actions: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch update metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks, then squash-merge minor/patch
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Poll REST check-runs instead of `gh pr checks --watch`: the watch
        # query also sees this very job ("auto-merge", pending) and would
        # deadlock waiting for itself. Also avoids the GraphQL workflowRun
        # permission the token does not get.
        run: |
          HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          state="pending"
          for i in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '
              [.check_runs[] | select(.name != "auto-merge")] as $c
              | if ($c | length) == 0 then "pending"
                elif ([$c[] | select(.status != "completed")] | length) > 0 then "pending"
                elif ([$c[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length) > 0 then "fail"
                else "pass" end')
            echo "poll $i: $state"
            [ "$state" = "pending" ] || break
            sleep 10
          done
          if [ "$state" != "pass" ]; then
            echo "checks are ${state}; leaving PR for manual review"
            exit 1
          fi
          gh pr merge "$PR_URL" --squash --delete-branch

      - name: Leave major updates for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "major version bump - human review required, not merging"
