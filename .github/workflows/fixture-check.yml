name: Test Fixture Check

on:
  push:
    paths:
      - "scripts/check-fixtures.mjs"
      - "pkg/routes/**"
      - ".github/workflows/fixture-check.yml"
  pull_request:
    paths:
      - "scripts/check-fixtures.mjs"
      - "pkg/routes/**"
      - ".github/workflows/fixture-check.yml"

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun run --cwd=webui check:fixtures
