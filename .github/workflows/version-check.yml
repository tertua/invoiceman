name: Version Check

on:
  push:
    paths:
      - "VERSION"
      - "web/package.json"
      - "web/CHANGELOG.md"
      - "scripts/sync-version.mjs"
      - ".github/workflows/version-check.yml"
  pull_request:
    paths:
      - "VERSION"
      - "web/package.json"
      - "web/CHANGELOG.md"
      - "scripts/sync-version.mjs"
      - ".github/workflows/version-check.yml"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fails when VERSION, web/package.json and web/CHANGELOG.md disagree:
      # the changelog needs a "## [vX.Y.Z]" section with real notes.
      - run: node scripts/sync-version.mjs --check
