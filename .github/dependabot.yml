version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
    time: "11:00"
  open-pull-requests-limit: 10
  # PRs must land on dev, never main: direct commits to main break
  # make check-flow (main has to stay an ancestor of dev).
  target-branch: dev
  # One PR per routine bump run (majors stay separate for manual review;
  # security updates are not affected by this group).
  groups:
    go-minor-patch:
      update-types: ["minor", "patch"]
- package-ecosystem: bun
  directory: "/webui"
  schedule:
    interval: weekly
    time: "11:00"
  open-pull-requests-limit: 5
  target-branch: dev
  groups:
    bun-minor-patch:
      update-types: ["minor", "patch"]
